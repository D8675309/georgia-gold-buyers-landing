<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --gold: #C5961A;
    --gold-light: #D4A84B;
    --gold-tint: #FBF5E6;
    --dark: #1a1a1a;
    --bg: #fafaf7;
    --text: #2a2a2a;
    --muted: #7d7a74;
    --border: #e6e2d9;
    --excellent: #3DAA57;
    --happy: #8BC34A;
    --average: #F5B800;
    --fair: #F28C1E;
    --poor: #E5473A;
  }
  html, body { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(900px 420px at 50% -10%, rgba(212,168,75,0.16), rgba(212,168,75,0) 70%);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: max(28px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }

  .wrap { width: 100%; max-width: 560px; text-align: center; }

  /* Brand */
  .brand { display: flex; flex-direction: column; align-items: center; margin-bottom: 26px; }
  .brand svg { width: 52px; height: 52px; filter: drop-shadow(0 4px 10px rgba(197,150,26,0.28)); }
  .brand-name {
    margin-top: 10px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dark);
  }
  .brand-name span { color: var(--gold); }

  /* Card */
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 34px 24px 28px;
    box-shadow: 0 1px 2px rgba(26,26,26,0.04), 0 18px 48px -18px rgba(26,26,26,0.14);
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute; left: 0; right: 0; top: 0; height: 4px;
    background: linear-gradient(90deg, var(--gold) 0%, var(--gold-light) 50%, var(--gold) 100%);
  }

  .store-chip {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 13px; font-weight: 600; letter-spacing: 0.01em;
    color: #8a6a12;
    background: var(--gold-tint);
    border: 1px solid #efe1bd;
    border-radius: 999px;
    padding: 6px 12px 6px 10px;
    margin-bottom: 18px;
  }
  .store-chip svg { width: 14px; height: 14px; }

  h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.015em;
    color: var(--dark);
    line-height: 1.2;
    margin-bottom: 10px;
    text-wrap: balance;
  }
  .sub {
    font-size: 16px;
    color: var(--muted);
    line-height: 1.5;
    max-width: 380px;
    margin: 0 auto 30px;
    text-wrap: balance;
  }

  /* Faces */
  .faces {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin: 0 auto 6px;
  }
  .face {
    flex: 1 1 0;
    max-width: 92px;
    min-width: 0;
    appearance: none;
    background: transparent;
    border: 0;
    border-radius: 18px;
    padding: 10px 2px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
    cursor: pointer;
    font: inherit;
    color: var(--muted);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    touch-action: manipulation;
    transition: transform .18s cubic-bezier(.2,.8,.3,1.2), opacity .25s ease, color .18s ease;
  }
  .face .circle {
    position: relative;
    width: 64px; height: 64px;
    border-radius: 50%;
    box-shadow: 0 3px 10px rgba(26,26,26,0.10), inset 0 -3px 0 rgba(0,0,0,0.08);
    transition: box-shadow .2s ease, transform .2s ease;
  }
  .face .circle svg { width: 100%; height: 100%; display: block; }
  .face .label {
    font-size: 13px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: 0.005em;
  }
  @media (hover: hover) {
    .face:hover { transform: translateY(-4px) scale(1.06); color: var(--dark); }
    .face:hover .circle { box-shadow: 0 10px 22px rgba(26,26,26,0.16), inset 0 -3px 0 rgba(0,0,0,0.08); }
  }
  .face:active { transform: scale(0.94); }
  .face:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  /* Ring + check that appear on selection */
  .face .ring {
    position: absolute; inset: -7px;
    border-radius: 50%;
    border: 3px solid var(--gold);
    opacity: 0; transform: scale(0.8);
  }
  .face .check {
    position: absolute; right: -4px; bottom: -4px;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 2px 6px rgba(0,0,0,0.18);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transform: scale(0);
  }
  .face .check svg { width: 14px; height: 14px; }

  .faces.picked .face { pointer-events: none; }
  .faces.picked .face:not(.selected) { opacity: 0.28; transform: scale(0.88); color: var(--muted); }
  .face.selected { color: var(--dark); transform: scale(1.1); }
  .face.selected .circle { animation: pop .45s cubic-bezier(.2,.9,.3,1.3) both; box-shadow: 0 12px 26px rgba(26,26,26,0.18), inset 0 -3px 0 rgba(0,0,0,0.08); }
  .face.selected .ring  { animation: ring .5s ease-out both; }
  .face.selected .check { animation: check .35s .12s cubic-bezier(.2,.9,.3,1.4) both; }

  @keyframes pop  { 0% { transform: scale(1); } 45% { transform: scale(1.18); } 100% { transform: scale(1.06); } }
  @keyframes ring { 0% { opacity: 0; transform: scale(0.8); } 35% { opacity: 1; } 100% { opacity: 0.9; transform: scale(1); } }
  @keyframes check{ 0% { opacity: 0; transform: scale(0); } 100% { opacity: 1; transform: scale(1); } }

  /* Status line under faces */
  .status {
    min-height: 20px;
    margin-top: 8px;
    font-size: 15px;
    font-weight: 600;
    color: var(--dark);
    opacity: 0;
    transform: translateY(4px);
    transition: opacity .25s ease, transform .25s ease;
  }
  .status.show { opacity: 1; transform: none; }

  /* Owner note */
  .owner {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-top: 14px; padding-top: 18px;
    border-top: 1px dashed var(--border);
    font-size: 14px; color: var(--muted); line-height: 1.4;
    text-align: left;
  }
  .owner .seal {
    flex: 0 0 auto;
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--gold-tint); border: 1px solid #efe1bd;
    display: flex; align-items: center; justify-content: center;
  }
  .owner .seal svg { width: 18px; height: 18px; }
  .owner strong { color: var(--text); font-weight: 600; }

  /* Store picker */
  .store-pick { display: none; }
  .store-pick.show { display: block; }
  .store-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px; }
  .store-btn {
    appearance: none; font: inherit; cursor: pointer;
    background: #fff;
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 18px 12px 16px;
    text-align: center;
    color: var(--dark);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: border-color .15s ease, background .15s ease, transform .15s ease;
    min-height: 92px;
  }
  .store-btn:hover, .store-btn:focus-visible { border-color: var(--gold); background: var(--gold-tint); outline: none; }
  .store-btn:active { transform: scale(0.97); }
  .store-btn .city { display: block; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  .store-btn .addr { display: block; margin-top: 5px; font-size: 13px; color: var(--muted); }

  .hidden { display: none !important; }

  /* Footer */
  .foot {
    margin-top: 22px;
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
  }
  .foot a { color: var(--gold); font-weight: 600; text-decoration: none; padding: 6px 2px; }
  .foot a:hover { text-decoration: underline; }

  @media (max-width: 420px) {
    body { padding-left: 14px; padding-right: 14px; }
    .card { padding: 30px 14px 24px; border-radius: 20px; }
    h1 { font-size: 26px; }
    .sub { font-size: 15px; margin-bottom: 26px; }
    .faces { gap: 2px; }
    .face { padding: 10px 0 8px; border-radius: 14px; }
    .face .circle { width: 58px; height: 58px; }
    .face .label { font-size: 12px; }
  }
  @media (min-width: 700px) {
    .card { padding: 44px 40px 36px; }
    h1 { font-size: 32px; }
    .faces { gap: 14px; }
    .face .circle { width: 76px; height: 76px; }
    .face .label { font-size: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>

<script>
(function () {
  // ── URL params ──────────────────────────────────────────────────
  //   cid  — customer_id        tx   — transaction_id
  //   appt — appointment_id     loc  — "valdosta" | "mcdonough"
  //   src  — link origin        name — customer name (first name used)
  var params = new URLSearchParams(window.location.search);
  var cid    = params.get('cid')  || '';
  var loc    = (params.get('loc') || '').toLowerCase();
  var apptId = params.get('appt') || '';
  var txId   = params.get('tx')   || '';
  var src    = params.get('src')  || 'rate_us_page';
  var name   = (params.get('name') || '').trim();
  var first  = name ? name.split(/\s+/)[0] : '';
  if (first) first = first.charAt(0).toUpperCase() + first.slice(1);

  var STORES = {
    valdosta:  { label: 'Valdosta',  tel: '2293750015', pretty: '(229) 375-0015',
                 google: 'https://search.google.com/local/writereview?placeid=ChIJ08YzzPdn7ogRYm5_TAy9OUk' },
    mcdonough: { label: 'McDonough', tel: '6789199265', pretty: '(678) 919-9265',
                 google: 'https://search.google.com/local/writereview?placeid=ChIJZwbKrEFZ9IgRyPYV6yuJULQ' }
  };

  var $ = function (id) { return document.getElementById(id); };
  var facesEl = $('faces'), pickEl = $('storePick'), statusEl = $('status');

  // ── Personalize heading ─────────────────────────────────────────
  $('heading').textContent = first ? (first + ', how was your visit?') : 'How was your visit?';

  // ── Store handling ──────────────────────────────────────────────
  function setStore(l) {
    loc = l;
    var s = STORES[loc];
    $('foot').innerHTML = 'Rather talk to someone? Call the ' + s.label + ' store at ' +
      '<a href="tel:' + s.tel + '" id="phoneLink">' + s.pretty + '</a>';
    $('storeChipText').textContent = s.label + ' store';
    $('sub').textContent = 'Tap the face that fits. One tap is all it takes.';
    pickEl.classList.remove('show');
    facesEl.classList.remove('hidden');
  }
  if (STORES[loc]) {
    setStore(loc);
  } else {
    // Old or broken link: ask which store instead of guessing.
    $('storeChipText').textContent = 'Two Georgia locations';
    $('sub').textContent = 'First, which store did you visit?';
    facesEl.classList.add('hidden');
    pickEl.classList.add('show');
    Array.prototype.forEach.call(document.querySelectorAll('.store-btn'), function (b) {
      b.addEventListener('click', function () { setStore(b.getAttribute('data-loc')); });
    });
  }

  // ── Log to POS (fire-and-forget, never blocks the redirect) ─────
  function logRatingToPOS(rating, next) {
    try {
      var payload = {
        customer_id:    cid    ? Number(cid)    : null,
        appointment_id: apptId ? Number(apptId) : null,
        transaction_id: txId   ? Number(txId)   : null,
        rating: rating,
        location: loc,
        source: src,
        page: 'rate-us',
        next: next,
        clicked_at: new Date().toISOString(),
        shop: 'ggb'
      };
      fetch('https://web-production-56765.up.railway.app/api/ratings/click', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        keepalive: true
      }).catch(function () {});
    } catch (e) { /* noop */ }
  }

  // ── Routing: 4-5 → store's Google review page (same tab); 1-3 → feedback form
  function destinationFor(rating) {
    if (rating >= 4) return STORES[loc].google;
    var qs = [];
    if (cid)    qs.push('cid='  + encodeURIComponent(cid));
    if (txId)   qs.push('tx='   + encodeURIComponent(txId));
    if (apptId) qs.push('appt=' + encodeURIComponent(apptId));
    qs.push('rating=' + rating);
    qs.push('src=' + encodeURIComponent(src));
    return 'feedback-' + loc + '.html?' + qs.join('&');
  }

  // ── One tap only ────────────────────────────────────────────────
  var picked = false;
  Array.prototype.forEach.call(facesEl.querySelectorAll('.face'), function (btn) {
    btn.addEventListener('click', function () {
      if (picked || !STORES[loc]) return;
      picked = true;
      var rating = Number(btn.getAttribute('data-rating'));
      var next = rating >= 4 ? 'google' : 'feedback';

      // Confirmation animation (≈600ms total before redirect)
      facesEl.classList.add('picked');
      btn.classList.add('selected');
      btn.setAttribute('aria-pressed', 'true');
      statusEl.textContent = (first ? 'Thanks, ' + first : 'Thanks') +
        (next === 'google' ? ' — one more second…' : ' — tell us what happened…');
      statusEl.classList.add('show');

      try { gtag('event', 'rating_submitted', { event_category: 'rate_us', rating: rating, location: loc }); } catch (e) {}
      logRatingToPOS(rating, next);

      setTimeout(function () { window.location.href = destinationFor(rating); }, 620);
    });
  });
})();
</script>
</body>
</html>
